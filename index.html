<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="css/style.css">
<script>
  // Paint the saved theme before the page shows (the full setting lives in the database)
  try { var t = localStorage.getItem('tracker-theme'); if (t && t !== 'midnight') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<div class="app" id="app">
  <div class="view" id="view"></div>

  <nav class="nav" id="nav" aria-label="Sections">

      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.7S5 10 5 15a7 7 0 0 0 14 0c0-5-7-12.3-7-12.3z"/></svg>Water
    </a>
    <a href="#/running" data-tab="running">

</div>
